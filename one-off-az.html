                    <!-- Borrower 1 Last Name -->

                    <!-- Phone -->

                           id="phone"

                    <!-- Email -->
                    <label for="email">

                           id="email"
                           name="email"
                           required
                           autocomplete="email">

                    <!-- Credit Score -->
                    <label for="creditScoreRange">

                    </label>
                    <select id="creditScoreRange" name="creditScoreRange">

                        <option value="750+">750+</option>

                        <option value="600-650">600–650</option>

                        <option value="50-99">$50,000–$99,999</option>

                        <option value="200+">$200,000+</option>

                    <!-- Amount Saved -->
                    <label for="amountSaved">

                           id="amountSaved"

                    <label for="questions">

                    </label>

                    <button type="submit">
                        Submit
                    </button>

                </form>
            </div>
        </section>
<script>
    const toggleBtn = document.getElementById("themeToggle");

    toggleBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");

        // Save inverse preference
        if (document.body.classList.contains("dark-mode")) {
            localStorage.setItem("theme", "dark");
        } else {
            localStorage.setItem("theme", "light");
        }
    });

    // Load saved theme
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
    }
</script>
    </main>

</body>
</html>
